name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace --release
      - name: Check shared version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; p=json.load(sys.stdin)["packages"]; v={x["version"] for x in p}; assert len(v)==1; print(v.pop())')
          test "$(target/release/skyline-cli --version)" = "Skyline $version"
      # Development testing artifacts use a fresh shared version for each new distribution.
      - name: Package development build
        id: package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: scripts/package-dev-build.sh ${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x64' }} dist
      - name: Upload development build
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 30
          if-no-files-found: error
