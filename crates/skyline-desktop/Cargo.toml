[package]
name = "skyline-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skyline-core = { path = "../skyline-core" }
anyhow.workspace = true
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

