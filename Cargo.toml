[workspace]
members = ["crates/skyline-core", "crates/skyline-desktop"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
crc32fast = "=1.5.0"
quick-xml = "=0.38.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tempfile = "=3.23.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[profile.release]
lto = "thin"
strip = true

